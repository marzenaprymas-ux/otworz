<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Otwórz rozmowę w Claude</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1d2330; --muted:#5d6677; --accent:#2f5fd0; --accent-fg:#ffffff; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151820; --fg:#e8ebf2; --muted:#9aa3b5; --accent:#8fb0ff; --accent-fg:#151820; color-scheme: dark; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font:17px/1.5 "Segoe UI", system-ui, sans-serif; }
  main { max-width:32rem; padding:24px 16px; display:grid; gap:16px; text-align:center; }
  h1 { margin:0; font-size:1.4rem; }
  p { margin:0; color:var(--muted); }
  a.btn { display:inline-block; padding:14px 22px; border-radius:10px; background:var(--accent); color:var(--accent-fg); font-weight:600; text-decoration:none; }
  a.btn:focus-visible { outline:3px solid var(--fg); outline-offset:3px; }
</style>
</head>
<body>
<main>
  <h1>Otwieram rozmowę w aplikacji Claude…</h1>
  <p id="info">Jeśli przeglądarka zapyta, kliknij „Otwórz”. Gdy nic się nie dzieje, kliknij przycisk poniżej.</p>
  <p><a class="btn" id="btn" href="#">Otwórz rozmowę</a></p>
</main>
<script>
  (function () {
    var id = (location.hash || '').replace(/^#/, '');
    var info = document.getElementById('info');
    var btn = document.getElementById('btn');
    if (!/^local_[0-9a-f-]{36}$/.test(id)) {
      info.textContent = 'W linku brakuje numeru rozmowy. Napisz do Claude: „otwórz rozmowę o …”.';
      btn.style.display = 'none';
      return;
    }
    var target = 'claude://claude.ai/epitaxy/' + id;
    btn.href = target;
    setTimeout(function () { location.href = target; }, 300);
  })();
</script>
</body>
</html>
